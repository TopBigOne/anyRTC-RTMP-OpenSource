plugins {
    id 'com.android.library'
}

android {
    compileSdk 31

    defaultConfig {
        minSdk 19
        targetSdk 31
        versionCode 1
        versionName "1.0"
        consumerProguardFiles "consumer-rules.pro"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                abiFilters 'arm64-v8a','armeabi-v7a'
                cppFlags '-std=c++14 -DANDROID -fno-rtti'
                // CMAKE_BUILD_TYPE 不在这里固定，改由下面 buildTypes 按 debug/release 分别传入，
                // 否则 native 层会一直按 Release 编译，即使 Java/Kotlin 侧选的是 debug variant，
                // 导致 ArLiveLite 源码断点对不上、变量被优化掉，没法正常单步调试
                arguments = ['-DANDROID_TOOLCHAIN=clang','-DANDROID_STL=c++_shared']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            externalNativeBuild {
                cmake {
                    // Release 包保持优化编译，体积更小、性能更好
                    arguments '-DCMAKE_BUILD_TYPE=Release'
                }
            }
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            externalNativeBuild {
                cmake {
                    // Debug 包关闭优化、保留完整调试信息，配合 Android Studio 的 Native/Dual 调试
                    // 可以直接在 ArLiveLite 的 .cpp 源码里下断点、单步、查看变量
                    arguments '-DCMAKE_BUILD_TYPE=Debug'
                }
            }
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.10.2"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    ndkVersion '20.0.5594570'

}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.android.material:material:1.4.0'
    testImplementation 'junit:junit:4.+'
}